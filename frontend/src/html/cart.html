<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <script type="module" defer src="../pages/cart-page.js"></script>
    <script type="module" defer src="../js/header.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header-inner container">
        <a class="logo" href="./index.html">MyShop</a>
        <button class="cart-btn">🛒 <span class="badge">0</span></button>
        <div class="minicart">
          <div class="list"></div>
          <div class="footer">
            <a href="./cart.html" class="btn primary goto" style="width: 100%"
              >Go to cart</a
            >
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <h1>Cart</h1>
      <div id="cartArea"></div>

      <h2 style="margin-top: 24px">Checkout</h2>
      <form id="orderForm" class="form" novalidate>
        <div class="field">
          <label>First name</label>
          <input class="input" name="FirstName" required />
          <div class="error-text" data-for="FirstName"></div>
        </div>
        <div class="field">
          <label>Last name</label>
          <input class="input" name="LastName" required />
          <div class="error-text" data-for="LastName"></div>
        </div>
        <div class="field">
          <label>Phone</label>
          <input
            class="input"
            name="Phone"
            required
            inputmode="numeric"
            pattern="^[0-9]+$"
          />
          <div class="error-text" data-for="Phone"></div>
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" name="Email" required type="email" />
          <div class="error-text" data-for="Email"></div>
        </div>
        <button id="submitBtn" class="btn primary" type="submit">
          Place order
        </button>
      </form>
    </main>
  </body>
</html>
